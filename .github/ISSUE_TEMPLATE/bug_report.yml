name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Before submitting, please check that a similar issue does not already exist.

        Do not include security vulnerabilities, credentials, secrets, webhook URLs, or personal data in a public issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem and its impact.
      placeholder: What is happening?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the smallest reliable sequence of steps that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: locale
    attributes:
      label: Affected Locale
      options:
        - Greek (`el`)
        - English (`en`)
        - Both
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide relevant environment information.
      placeholder: |
        Browser:
        Browser version:
        Operating system:
        Device:
        Viewport:
        URL / route:
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or Recordings
      description: Add screenshots or recordings if they help demonstrate the issue. Do not include personal or sensitive information.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other information that may help investigate the issue.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed any personal data, credentials, secrets, and webhook URLs from this report.
          required: true
